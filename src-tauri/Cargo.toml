[package]
name = "storage-app"
description = "Storage: see and clear what coding agents and dev tools leave on your Mac."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "storage"

[[bin]]
name = "storage"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
storage-core = { path = "../crates/storage-core" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSTimer", "NSURL", "NSValue", "NSDate"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSAccessibilityProtocols", "NSBezierPath", "NSButton", "NSColor", "NSControl", "NSCursor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSText", "NSTextField", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
